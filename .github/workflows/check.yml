name: check
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  whale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun scripts/check-whale.ts
      - run: bun scripts/build-skins.ts --check
